name: claimlens
description: ClaimLens mobile client for claim submission and review.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^8.1.4
  flutter_secure_storage: ^9.2.2
  http_parser: ^4.1.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  provider: ^6.1.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
